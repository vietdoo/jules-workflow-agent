services:
  - type: web
    name: jules-workflow-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: JULES_API_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET_TOKEN
        generateValue: true
      - key: JULES_API_URL
        value: https://jules.googleapis.com/v1alpha
      - key: JULES_SOURCE
        sync: false
      - key: JULES_STARTING_BRANCH
        value: main
      - key: JULES_REQUIRE_PLAN_APPROVAL
        value: "false"
      - key: JULES_AUTOMATION_MODE
        sync: false
      - key: AGENT_DEFAULT_ID
        value: jules
      - key: JULES_TIMEOUT_SECONDS
        value: "60"
      - key: JULES_POLL_INTERVAL_SECONDS
        value: "2"
      - key: JULES_REPLY_TIMEOUT_SECONDS
        value: "120"
      - key: LOG_LEVEL
        value: INFO
